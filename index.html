<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sai Chandra Vuddamari | Research and Innovation Analyst</title>
    <meta name="description" content="Data analyst working in SQL, Python, R, and Power BI: dashboards, forecasting, anomaly detection, and automated reporting." />
    <meta name="author" content="Sai Chandra Vuddamari" />
    <meta name="keywords" content="" />
    <meta property="og:title" content="Sai Chandra Vuddamari | Research and Innovation Analyst" />
    <meta property="og:description" content="Data analyst working in SQL, Python, R, and Power BI." />
    <meta property="og:image" content="https://saichandravuddamari.com/assets/img/profile.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Public+Sans:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header" id="navbar">
      <div class="container nav">
        <a class="nav-brand" href="#home"></a>
        <button class="nav-toggle" id="navToggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="navMenu">
          <span></span>
          <span></span>
        </button>
        <ul class="nav-menu" id="navMenu"></ul>
      </div>
    </header>

    <main id="main">
      <!-- Hero: name, summary, portrait, and a timeline chart built from experience + education data -->
      <section id="home" class="hero">
        <div class="container hero-grid">
          <div class="hero-copy">
            <p class="hero-role" id="heroTitle"></p>
            <h1 class="hero-name" id="heroName"></h1>
            <p class="hero-summary" id="heroSummary"></p>
            <div class="hero-cta" id="heroCTA"></div>
          </div>
          <figure class="hero-plate" id="heroAvatar"></figure>
        </div>
        <div class="container">
          <figure class="career-chart" id="careerChart">
            <figcaption>Career path</figcaption>
          </figure>
        </div>
      </section>

      <section id="about" class="section">
        <div class="container">
          <h2 class="section-title"></h2>
          <div class="about-grid">
            <div class="about-text" id="aboutText"></div>
            <dl class="about-stats" id="aboutStats"></dl>
          </div>
        </div>
      </section>

      <section id="experience" class="section section-alt">
        <div class="container">
          <h2 class="section-title"></h2>
          <ol class="roles" id="experienceTimeline"></ol>
        </div>
      </section>

      <section id="projects" class="section">
        <div class="container">
          <h2 class="section-title"></h2>
          <p class="section-lede" id="projectsLede"></p>
          <div class="projects-grid" id="projectsGrid"></div>
        </div>
      </section>

      <section id="skills" class="section section-alt">
        <div class="container">
          <h2 class="section-title"></h2>
          <div class="skills-grid" id="skillsGrid"></div>
        </div>
      </section>

      <section id="education" class="section">
        <div class="container">
          <h2 class="section-title"></h2>
          <ol class="roles" id="educationGrid"></ol>
          <div class="certifications" id="certifications">
            <h3></h3>
            <ul class="skill-list"></ul>
          </div>
        </div>
      </section>

      <section id="contact" class="section contact">
        <div class="container">
          <div class="contact-panel">
            <div>
              <h2 class="section-title"></h2>
              <p class="contact-lede" id="contactLede"></p>
            </div>
            <ul class="contact-list" id="contactInfo"></ul>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <p id="footerCopyright"></p>
        <div class="footer-links" id="footerLinks"></div>
      </div>
    </footer>

    <script src="assets/js/main.js"></script>
  </body>
</html>
